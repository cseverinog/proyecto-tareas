name: CI Docker

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: cp .env.example .env

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas de la aplicación
        run: |
          pip install -r requirements.txt
          python -m pytest

      - name: Construir las imágenes
        run: docker compose build

      - name: Levantar servicios
        run: docker compose up -d --wait

      - name: Probar comunicación entre app y PostgreSQL
        run: |
          curl --fail-with-body --retry 10 --retry-all-errors \
            -X POST http://localhost:5000/tareas \
            -H "Content-Type: application/json" \
            -d '{"titulo":"Prueba CI"}'

          curl --fail-with-body --retry 10 --retry-all-errors \
            http://localhost:5000/tareas | grep -q "Prueba CI"

      - name: Mostrar logs si falla la integración
        if: failure()
        run: docker compose logs

      - name: Validar configuración Compose
        run: docker compose config

      - name: Detener servicios
        if: always()
        run: docker compose down -v
